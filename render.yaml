# Blueprint de Render: servicio web (Docker) + PostgreSQL gratuito.
# En Render: New > Blueprint > seleccionar este repositorio.
databases:
  - name: bladesinsight-db
    plan: free
    databaseName: bladesinsight
    user: bladesinsight

services:
  - type: web
    name: bladesinsight-admin
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: bladesinsight-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@bladesinsight.app
      - key: ADMIN_PASSWORD
        generateValue: true   # se ve en Render > Environment (cámbiela si lo desea)
